name: Deploy main

# Deploy otomatis ke server demo (thinkpad) setiap kali main diperbarui.
# Runner `self-hosted` terpasang di server itu sendiri, jadi workflow ini tidak
# menyimpan SSH key atau secret apa pun di GitHub.
#
# Pengganti langkah manual: `git pull --ff-only` lalu `docker compose up -d
# --build` di server. Hanya push ke main yang memicu deploy — branch lain
# dan pull request tidak menyentuh server.
#
# Catatan keamanan: server adalah milik tim, jangan tambahkan trigger
# `pull_request` ke workflow ini (kode dari fork akan jalan di server).

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, thinkpad]
    timeout-minutes: 30
    steps:
      - name: Tarik kode main
        run: |
          set -euo pipefail
          cd "$HOME/capstone-projek"
          git checkout main
          # --ff-only: deploy berhenti dan gagal bila server punya perubahan
          # lokal yang belum di-commit, bukannya menimpanya diam-diam.
          git fetch --prune origin main
          git merge --ff-only origin/main
          git log -1 --oneline

      - name: Bersihkan image lama
        run: |
          set -euo pipefail
          # Tiap --build meninggalkan image lama tanpa tag. Tanpa ini disk
          # runner penuh dan deploy berikutnya gagal dengan "No space left on
          # device" (disk 468G pernah terisi 100% oleh 442G image dung).
          docker image prune -f
          docker builder prune -af

      - name: Bangun ulang dan jalankan container
        run: |
          set -euo pipefail
          cd "$HOME/capstone-projek"
          # --build sekaligus menjalankan migrasi baru (entrypoint backend) saat
          # image berubah; perubahan backend/src tetap terpakai lewat --reload.
          docker compose up -d --build

      - name: Tunggu backend sehat
        run: |
          set -euo pipefail
          cd "$HOME/capstone-projek"
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then
              echo "backend sehat setelah ${i} percobaan"
              exit 0
            fi
            sleep 2
          done
          echo "backend tidak sehat setelah 120 detik; log terakhir:"
          docker compose logs --tail=80 backend
          exit 1
