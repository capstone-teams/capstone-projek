course:
  name: Matematika Diskrit
  credits: null
  semester: null
  description: >-
    Mata kuliah ini membahas struktur diskrit sebagai fondasi informatika,
    meliputi logika, proposisi, ekuivalensi, predikat dan quantifier,
    aturan penarikan kesimpulan, metode pembuktian, induksi matematika,
    teori himpunan, relasi dan fungsi, aljabar Boolean, kombinatorial,
    dan teori bilangan.

cpmk:
  - code: CPMK-1
    description: >-
      Mahasiswa mampu menerapkan konsep proposisi, ekuivalensi,
      predikat dan quantifier pada suatu pernyataan.

  - code: CPMK-2
    description: >-
      Mahasiswa mampu menganalisis suatu kesimpulan dari beberapa
      pernyataan matematika.

  - code: CPMK-3
    description: >-
      Mahasiswa mampu mengimplementasikan teknik-teknik pembuktian
      pada sebuah pernyataan.

  - code: CPMK-4
    description: >-
      Mahasiswa mampu menerapkan dan mengimplementasikan konsep himpunan.

  - code: CPMK-5
    description: >-
      Mahasiswa mampu menerapkan dan mengimplementasikan relasi dan fungsi.

  - code: CPMK-6
    description: >-
      Mahasiswa mampu menerapkan konsep induksi matematika.

  - code: CPMK-7
    description: >-
      Mahasiswa mampu menerapkan rekursi dan relasi rekurens.

  - code: CPMK-8
    description: >-
      Mahasiswa mampu menerapkan dan mengaplikasikan konsep aljabar Boolean.

  - code: CPMK-9
    description: >-
      Mahasiswa mampu menganalisis dan menerapkan konsep teori bilangan.

  - code: CPMK-10
    description: >-
      Mahasiswa mampu menerapkan dan menganalisis konsep kombinatorial
      pada sebuah kasus.

sub_cpmk: []

weekly_plan:
  - weeks: [1]
    materials:
      - Konsep logika proposisi
      - Konsep ekuivalensi
    methods:
      - Kuliah/ceramah
      - Diskusi
      - Latihan soal
    learning_experience: >-
      Kehadiran, tanya jawab, diskusi, dan belajar mandiri.
    indicators:
      - >-
        Ketepatan dalam menentukan proposisi dan ekuivalensi
        dalam logika matematika.
    assessment:
      criteria: Ketepatan dalam menjawab
      weight_percent: 100
    duration:
      face_to_face_minutes: 150
      independent_study_minutes: 180

  - weeks: [2]
    materials:
      - Konsep predikat dan quantifier
      - Aturan penarikan kesimpulan
    methods:
      - Kuliah/ceramah
      - Diskusi
      - Latihan soal
    learning_experience: >-
      Kehadiran, tanya jawab, diskusi, dan belajar mandiri.
    indicators:
      - Ketepatan dalam menentukan predikat dan menggunakan quantifier
      - Ketepatan dalam menentukan kesimpulan dari logika matematika
    assessment:
      criteria: Ketepatan dalam menjawab
      weight_percent: 100
    duration:
      face_to_face_minutes: 150
      independent_study_minutes: 180
      structured_assignment_minutes: 180

  - weeks: [3]
    materials:
      - Pembuktian secara langsung
      - Pembuktian dengan kontraposisi
      - Pembuktian dengan kontradiksi
    methods:
      - Kuliah/ceramah
      - Diskusi
      - Latihan soal
    learning_experience: >-
      Kehadiran, tanya jawab, diskusi, belajar mandiri, dan Tugas 1.
