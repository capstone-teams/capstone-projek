[project]
name = "backend"
version = "0.1.0"
description = "Backend service for Capstone Moodle Agentic AI"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "bcrypt<4.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic>=2.9.0",
    "pyyaml>=6.0",
    "pydantic-settings>=2.5.0",
    "pyjwt[crypto]>=2.9.0",
    "python-multipart>=0.0.12",
    "requests>=2.34.2",
    "shortuuid>=1.0.13",
    "sqlalchemy[asyncio]>=2.0.35",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
]

[project.optional-dependencies]
# Konverter dokumen RPS (BE-05.2). Sengaja **bukan** dependensi utama: Docling
# menarik torch, docling-ibm-models, opencv, dan model ML berukuran ratusan MB
# (unduhan model pertama kali sekitar 0,5 GB), sehingga pemasangannya menjadi
# pilihan operator — bukan beban wajib seluruh tim dan image Docker:
#
#     uv sync --extra docling
#
# Tanpa extra ini aplikasi tetap berjalan; endpoint pemrosesan RPS gagal dengan
# error domain `RPS_PROCESSING_FAILED` beserta pesan yang menyebutkan perintah
# pemasangannya (lihat src/services/rps/docling_converter.py).
docling = [
    "docling>=2.140.0,<3.0.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]
